name: Security

# Dependency advisory scan, deliberately in its own workflow so it can never
# interfere with the CI/CD pipeline in ci-cd.yml (test → build-push → deploy).
# A vulnerable transitive dep is not a reason to block a release deploy.
on:
  pull_request:
    branches: [main]
  # `push` is here deliberately, in addition to `pull_request`. `pull_request` is the
  # load-bearing trigger — it is what makes CI judge the MERGE tree, which is the tree
  # that actually lands. But a direct push to `main` skips review entirely, and that is
  # precisely the path where an unscanned credential would land AND deploy (on this repo
  # a merge to main is a production deploy, with no human gate after it). A gate that
  # covers only the disciplined route does not cover the route that needs it most.
  push:
    branches: [main]
  schedule:
    # Mondays 01:00 UTC (09:00 SGT) — catches advisories published against deps
    # we never touched, which is how 20 of them accumulated unnoticed between
    # the SEC-7 bump and the 2026-09-27 re-scan.
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # `pnpm audit` at high+critical. Reads pnpm-lock.yaml directly, so there is no
  # install step and the job finishes in seconds.
  #
  # BLOCKING as of 2026-10-19 (owner's call): the 5 high advisories this job used to report
  # (js-yaml x2, deepmerge-ts, braces, source-map-js) are now either bumped via
  # `pnpm.overrides` (bounded to the real consuming package's own declared range, never a bare
  # unbounded floor) or, for the two with no patched version available at all in range
  # (braces/GHSA-vfj7-8cjw-p6xm, and deepmerge-ts/GHSA-ggr8-5vv4-36mx — the latter needs a real
  # breaking major the owner chose to waive rather than take), explicitly waived via
  # `pnpm.auditConfig.ignoreGhsas` — never a blanket `--audit-level` drop. See
  # docs/dependency-audit-waivers.md for every waiver's reason and re-check trigger; a new
  # advisory against an UNBOUNDED or already-waived package is a real, new finding, not
  # expected noise. `continue-on-error` removed in the same change this comment describes.
  # 🔴 This repo's `main` DOES have required status checks (`test`, `Credential-shaped
  # literals` — confirmed directly via the PR-level GraphQL `isRequired` field, the one view
  # that reads correctly for a non-admin token; the REST branch-protection endpoint 404s for
  # anyone without admin on the repo regardless of whether protection exists, and even
  # `branchProtectionRules` over GraphQL can come back silently empty the same way — neither
  # absence is evidence of "no protection"). This job is confirmed `isRequired: false` there,
  # by the owner's own explicit decision, not because no protection exists at all — removing
  # `continue-on-error` is safe because this check staying non-required is a deliberate choice,
  # not a structural gap.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency advisories (high + critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose. pnpm/action-setup@v4 reads `packageManager` from
      # package.json, which is the single source of truth for the pnpm version. Passing
      # BOTH makes the action throw "Multiple versions of pnpm specified" — it compares
      # them as strings (`packageManager.replace('pnpm@','') !== version`), so
      # `pnpm@9.15.0` vs `version: 9` is a mismatch, not a match. With NEITHER set the
      # action requires a version and fails, so the `packageManager` pin is a hard
      # precondition for this job.
      # ✅ SATISFIED: `main` carries `"packageManager": "pnpm@9.15.0"` (package.json:53)
      # as of `25e329c`, 2026-09-28. This comment previously read "PRECONDITION: needs
      # the pin merged first" — that was true when written and is now false, and a
      # reviewer could have held this PR back on it. A comment that argues for a decision
      # already taken keeps arguing: when a blocker clears, the note that named it has to
      # clear with it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit
        run: |
          set -o pipefail
          # Tee the report into the job summary so a reviewer sees what fired
          # without opening the log; the exit code still decides pass/fail.
          pnpm audit --audit-level high 2>&1 | tee audit.txt || failed=1
          {
            echo "## Dependency advisories (high + critical)"
            echo
            if [ "${failed:-0}" = "0" ]; then
              echo "No high or critical advisories against \`pnpm-lock.yaml\`."
            else
              echo "\`pnpm audit --audit-level high\` reported advisories."
              echo "Triage by **reachability**, not severity alone: most hits are in the"
              echo "dev/build toolchain and never reach the production image, which copies"
              echo "only \`.next/standalone\`, \`public\` and \`.next/static\`."
            fi
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${failed:-0}"

  # ---------------------------------------------------------------------------
  # Repo-wide credential-shape scan. Fails on any string literal assigned to a
  # password/secret/token-like identifier that is not explicitly allow-listed.
  #
  # A SEPARATE job from `audit` on purpose: a credential-shaped literal and a
  # dependency advisory are unrelated findings, and putting them in one job
  # would let one mask the other in the summary and force them to share a
  # single `continue-on-error` lifecycle.
  #
  # Shape, not values: a list of known secrets only looks backwards, and
  # writing one into the repo to prove a secret is gone plants most of it back.
  # This catches the NEXT credential, whatever it is called, without naming any
  # value — including the `process.env.X ?? "literal"` fallback form, which is
  # the form such a literal actually tends to live in.
  #
  # BLOCKING. It was non-blocking while the two real shared-password literals
  # were still on main; the W2a-ADDENDUM cleared them and the scan is green on
  # main with 0 pending, so the exemption's premise is spent and it is gone.
  # 🔴 Do NOT reintroduce `continue-on-error` at JOB level here: it would also
  # cover the self-test below, which is the one step whose entire job is to
  # prove this scanner is not silently measuring nothing. If a temporary
  # exemption is ever genuinely needed, put it on the SCAN STEP only, never on
  # the job. (The `audit` job keeps its own flag on its own 2026-10-11
  # lifecycle — deliberately independent of this one.)
  # ---------------------------------------------------------------------------
  client-document-disclosure:
    name: Client-document disclosure
    runs-on: ubuntu-latest
    # Its own named check, beside Credential-shaped literals, for the same
    # reason that one is: an invoice or a quotation that has been emailed to a
    # client cannot be recalled. The owner ruled on 2026-10-08 that neither
    # document may carry commission, upline/downline overrides, the Managing
    # Director cut or company retained — only what the client pays.
    #
    # It also runs inside the main `test` job, since it is an ordinary vitest
    # file. It is lifted out here so the gate is VISIBLE as its own red or
    # green on the PR rather than one assertion among nineteen hundred, and so
    # it can be made a required check independently of the whole suite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # No database and no browser: the checks are static reads of the document
      # templates, so this job stays fast enough to be a required gate.
      # The unit project's globalSetup (lib/test-support/env-preflight.ts) validates
      # the whole env schema before any worker starts, and fails closed when it
      # cannot. Without these three the job dies in setup and NO assertion runs —
      # which is how this gate sat on main having never checked anything. These are
      # throwaway CI values; the job reads files off disk and touches no database.
      - name: Assert no client document carries internal money
        env:
          AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm vitest run --project unit lib/pdf/client-document-disclosure.test.ts

  credential-shape:
    name: Credential-shaped literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 🔴 This step must never be exempted from failing the job. An earlier
      # revision of this file said it was "NOT covered by continue-on-error's
      # purpose" while a JOB-level flag covered every step including this one —
      # true of the intent, false of the effect, and the flag is gone now
      # (DevLead caught it, 2026-09-27). It asserts the scan's own shape
      # claims against its real code path. It
      # exists because the fallback rule (`IDENT = env.X ?? "literal"`) shipped
      # dead — a wrong backreference made every fallback match arrive with an
      # empty literal, which the empty-string rule wrote off as benign. Nothing
      # ever went red. If this step fails, the scan below is not measuring what
      # it says it measures, and its silence means nothing.
      - name: Self-test the scan's shape claims
        run: node .github/scripts/credential-shape-scan.mjs --self-test

      - name: Scan for credential-shaped literals
        run: |
          set -o pipefail
          # No install: the scanner is dependency-free, stdlib only.
          node .github/scripts/credential-shape-scan.mjs 2>&1 | tee scan.txt || failed=1
          {
            echo "## Credential-shaped literals"
            echo
            if [ "${failed:-0}" = "0" ]; then
              echo "No unexplained credential-shaped literals."
            else
              echo "A string literal is assigned to a password/secret/token-like identifier"
              echo "and is not in \`.github/credential-shape-allowlist.tsv\`."
              echo
              echo "Fix it by moving the value to the environment. If it genuinely cannot be a"
              echo "secret (a self-describing placeholder, for example), add it to the allow-list"
              echo "**with a reason** — entries are per location and include the expected value,"
              echo "so swapping a real secret in at an allow-listed spot still fails."
            fi
            echo
            echo '```'
            cat scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${failed:-0}"
