              echo "::warning::DISK WAS NOT RECLAIMED. deploy/reclaim-images.sh did not report completion, so this repository's superseded images are still on the deploy host. The deploy itself is fine and verified — but do not read this run as a successful cleanup. Check free space before assuming the next deploy has room."
